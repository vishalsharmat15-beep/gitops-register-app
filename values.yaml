replicaCount: 2

image:
  repository: vishalsharma09/fashion-signup-app
  tag: "1.0.0-56"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi

databaseSecret:
  name: register-app-db
  urlKey: DB_URL
  userKey: DB_USER
  passwordKey: DB_PASSWORD

app:
  name: register-app
  deploymentName: register-app-deployment
  serviceName: register-app-service
